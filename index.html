<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avishay's First Project</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous">
        </script>
    <script defer src="/app.js"></script>
</head>

<body onload="showTasksOnLoad()">
    <header class="col-12 header text-center">
        <h1>My task board</h1>
    </header>
    <section>
        <div onsubmit="addTask()" class="container">
            <form class="row">
                <input class="form-control my-2" type="text" id="taskBox" placeholder="Your new task is...." required>
                <input class="form-control my-2" type="datetime-local" id="datetimeBox" required>
                <button class="btn btn-danger col-12 col-sm-6 my-2 mx-" type="reset" id="rmTaskButton">Clean fields</button>
                <button class="btn btn-primary col-12 col-sm-6 my-2 mx-" type="submit" id="addTaskButton">Add your new task</button>
            </form>
        </div>
        <div id="tasksBox" class="tasksBox d-flex flex-wrap">
            
        </div>
    </section>
    
    



</body>

</html>
